# ─────────────────────────────────────────────────────────────
#  PoHtimer · Website Deploy Workflow
#
#  Triggers:
#    - After a successful release (downloads latest.json and bakes it in)
#    - Manual dispatch for hotfixes
#
#  Deploys to: Vercel (primary) with Netlify fallback config included
#
#  Required secrets:
#    VERCEL_TOKEN       – from vercel.com/account/tokens
#    VERCEL_ORG_ID      – from .vercel/project.json after first deploy
#    VERCEL_PROJECT_ID  – from .vercel/project.json after first deploy. This required only when forced.
# ─────────────────────────────────────────────────────────────
name: Deploy Website

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      # ── Checkout repo ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Get latest release version ──────────────────────────
      - name: Fetch latest release info
        id: release
        run: |
          DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          VERSION=$(echo $DATA | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      # ── Download latest.json ────────────────────────────────
      - name: Download latest.json
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" \
            -o website/latest.json || echo "{\"version\":\"${{ steps.release.outputs.version }}\",\"notes\":\"\",\"platforms\":{}}" > website/latest.json

          echo "=== latest.json ==="
          cat website/latest.json

      # ── Inject version into HTML ────────────────────────────
      - name: Inject version into website
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          sed -i "s/v1\.0\.0/v$VERSION/g" website/index.html
          sed -i "s/PoHtimer_1\.0\.0/PoHtimer_$VERSION/g" website/index.html

          echo "✓ Injected version $VERSION"

      # ── Install Vercel CLI ──────────────────────────────────
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ── Pull Vercel project config (IMPORTANT FIX) ──────────
      - name: Link project (vercel pull)
        run: |
          vercel pull --yes \
            --environment=production \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_ORG_ID

        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      # ── Deploy to Vercel (Production) ───────────────────────
      - name: Deploy to Vercel (Production)
        id: deploy
        if: ${{ github.event.inputs.environment == 'production' || github.event_name == 'workflow_run' }}
        run: |
          URL=$(vercel deploy website/ \
            --prod \
            --token=$VERCEL_TOKEN \
            --yes | tail -1)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✓ Deployed to: $URL"

        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ── Deploy Preview (optional) ───────────────────────────
      - name: Deploy to Vercel (Preview)
        if: ${{ github.event.inputs.environment == 'preview' }}
        run: |
          vercel deploy website/ \
            --token=$VERCEL_TOKEN \
            --yes

        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ── Summary ─────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## 🌐 Website deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**latest.json:** ✅ Updated" >> $GITHUB_STEP_SUMMARY