<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PoHtimer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        overflow: hidden;
      }
      *, *::before, *::after { box-sizing: border-box; }
      .splash {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(255,185,0,0.18), transparent 55%),
                    rgba(10,12,16,0.95);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(255,185,0,0.15);
        overflow: hidden;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #ffb900;
        color: #0a0c10;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        box-shadow: 0 0 24px rgba(255,185,0,0.35);
      }
      .logo::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 18px;
        border: 1px solid rgba(255,185,0,0.3);
        animation: pulse 1.6s ease-out infinite;
      }
      .title {
        font-size: 20px;
        letter-spacing: 0.08em;
        color: #f0f2f5;
        font-weight: 700;
      }
      .title span {
        color: #ffb900;
      }
      .sub {
        font-size: 11px;
        color: #8a91a0;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, rgba(255,185,0,0.15), rgba(255,185,0,0.9));
        animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-60%); }
        100% { transform: translateX(220%); }
      }
      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(1); }
        70% { opacity: 0; transform: scale(1.6); }
        100% { opacity: 0; transform: scale(1.6); }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="stack">
        <div class="logo">◷</div>
        <div class="title">POH<span>TIMER</span></div>
        <div class="sub">Power Scheduler</div>
        <div class="bar"><span></span></div>
      </div>
    </div>
  </body>
</html>
